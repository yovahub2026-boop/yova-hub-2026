<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <title>إدارة الرسائل | لوحة التحكم</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="../css/style.css" />
    <link rel="stylesheet" href="../css/admin.css" />
    <link rel="icon" href="../favicon.ico" type="image/x-icon" />
</head>

<body class="admin-body">

    <div class="admin-layout">
        <aside class="admin-sidebar">
            <a href="index.html" class="logo">Yova-Hub</a>
            <nav class="admin-nav" id="adminNav">
                <a href="index.html">الرئيسية (Dashboard)</a>
                <a href="websites.html">إدارة المواقع</a>
                <a href="categories.html">إدارة التصنيفات</a>
                <a href="orders.html">إدارة الطلبات</a>
                <a href="messages.html" class="active">إدارة الرسائل</a>
                <a href="settings.html">الإعدادات</a>
                <a href="#" class="logout-btn" id="logoutBtn">تسجيل الخروج</a>
            </nav>
        </aside>

        <main class="admin-main">
            <div class="admin-header">
                <h1>إدارة الرسائل</h1>
            </div>

            <div class="table-wrapper">
                <table class="admin-table">
                    <thead>
                        <tr>
                            <th>الاسم</th>
                            <th>رقم الهاتف</th>
                            <th>العنوان</th>
                            <th>إجراءات</th>
                        </tr>
                    </thead>
                    <tbody id="messagesTable">
                        <tr>
                            <td colspan="4" style="text-align:center;">جاري التحميل...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </main>
    </div>

    <!-- Modal تفاصيل الرسالة -->
    <div class="modal admin-modal" id="messageModal" hidden>
        <div class="modal-overlay" id="messageModalOverlay"></div>
        <div class="modal-content">
            <button type="button" class="modal-close" id="closeMessageModal">×</button>
            <h2>تفاصيل الرسالة</h2>
            <div id="messageDetails" style="margin-top: var(--space-md); line-height: 1.8;"></div>
        </div>
    </div>

    <!-- Supabase SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../js/supabase/config.js"></script>
    <script src="../js/supabase/auth.js"></script>
    <script src="../js/supabase/database.js"></script>

    <script src="../js/utils.js"></script>
    <script src="../js/admin/messages.js"></script>
</body>

</html>
