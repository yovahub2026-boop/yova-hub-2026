<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <title>إدارة التصنيفات | لوحة التحكم</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="../css/style.css" />
    <link rel="stylesheet" href="../css/admin.css" />
    <link rel="icon" href="../favicon.ico" type="image/x-icon" />
</head>

<body class="admin-body">

    <div class="admin-layout">
        <aside class="admin-sidebar">
            <a href="index.html" class="logo">Yova-Hub</a>
            <nav class="admin-nav" id="adminNav">
                <a href="index.html">الرئيسية (Dashboard)</a>
                <a href="websites.html">إدارة المواقع</a>
                <a href="categories.html" class="active">إدارة التصنيفات</a>
                <a href="orders.html">إدارة الطلبات</a>
                <a href="messages.html">إدارة الرسائل</a>
                <a href="settings.html">الإعدادات</a>
                <a href="#" class="logout-btn" id="logoutBtn">تسجيل الخروج</a>
            </nav>
        </aside>

        <main class="admin-main">
            <div class="admin-header">
                <h1>إدارة التصنيفات</h1>
                <button class="btn btn-primary" id="addCategoryBtn">+ إضافة تصنيف جديد</button>
            </div>

            <div class="table-wrapper">
                <table class="admin-table">
                    <thead>
                        <tr>
                            <th>اسم التصنيف</th>
                            <th>معرف التصنيف (ID)</th>
                            <th>إجراءات</th>
                        </tr>
                    </thead>
                    <tbody id="categoriesTable">
                        <tr>
                            <td colspan="3" style="text-align:center;">جاري التحميل...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </main>
    </div>

    <!-- Modal إضافة / تعديل تصنيف -->
    <div class="modal admin-modal" id="categoryModal" hidden>
        <div class="modal-overlay" id="categoryModalOverlay"></div>
        <div class="modal-content">
            <button type="button" class="modal-close" id="closeCategoryModal">×</button>
            <h2 id="categoryModalTitle">إضافة تصنيف</h2>

            <form id="categoryForm" class="form">
                <input type="hidden" id="categoryId" />
                <div class="form-group">
                    <label for="categoryName">اسم التصنيف *</label>
                    <input type="text" id="categoryName" required maxlength="50" placeholder="مثال: مواقع الشركات" />
                </div>
                <button type="submit" class="btn btn-primary" id="saveCategoryBtn">حفظ</button>
                <div class="form-status" id="categoryStatus"></div>
            </form>
        </div>
    </div>

    <!-- Supabase SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../js/supabase/config.js"></script>
    <script src="../js/supabase/auth.js"></script>
    <script src="../js/supabase/database.js"></script>

    <script src="../js/utils.js"></script>
    <script src="../js/admin/categories.js"></script>
</body>

</html>
